# Builds the source tarball on GitHub, so that a release file never carries
# the account name of the machine it was built on: R CMD build stamps the
# builder's user name into DESCRIPTION's Packaged: field, and no environment
# variable overrides it. The step fails if that field names anyone but the
# GitHub runner, or if the tarball holds a private or review folder, or if
# the public leak rules find anything. The tarball and its SHA-256 are uploaded as an artifact,
# to attach to a release by hand. Read-only: it publishes nothing.
name: release-tarball

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: build
      - name: Build the source tarball
        run: R CMD build .
      - name: Check Packaged carries no local user name
        run: |
          tarball=$(ls knowledgelayer_*.tar.gz)
          packaged=$(tar -xzOf "$tarball" knowledgelayer/DESCRIPTION | grep '^Packaged:')
          echo "$packaged"
          case "$packaged" in
            *"; runner") echo "OK: built by the GitHub runner" ;;
            *) echo "::error::Packaged: names '${packaged##*; }', not the GitHub runner"; exit 1 ;;
          esac
          python3 -I data-raw/leak_scan.py --public-only --tarball "$tarball" .
          sha256sum "$tarball" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: knowledgelayer-source-tarball
          path: |
            knowledgelayer_*.tar.gz
            SHA256SUMS.txt
